name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python
        run: uv python install 3.14

      - name: Sync dependencies
        run: |
          uv sync --locked --group build

      - name: Build with PyInstaller
        run: uv run --no-sync python scripts/build.py
        env:
          RAM_RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Verify build output
        run: |
          if not exist "dist\RobloxAccountManager.exe" (
            echo Build output missing.
            exit /b 1
          )
        shell: cmd

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Evanovar's RAM ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/RobloxAccountManager.exe
